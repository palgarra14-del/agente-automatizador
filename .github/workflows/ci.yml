name: CI
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Build prepared Node 22 / pnpm 11.19.0 image
        run: docker build --pull=false --tag agent-node22-pnpm11:local docker/node22-pnpm11
      - name: Verify real Docker execution boundary
        run: node scripts/docker-integration-smoke.js
