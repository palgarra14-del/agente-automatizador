name: Agent Cloud Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: agent-cloud-watchdog
  cancel-in-progress: false

jobs:
  dispatch-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dispatch cloud worker only if stale
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_WATCHDOG_MAX_AGE_MINUTES: '20'
        run: node scripts/cloud-watchdog.js
