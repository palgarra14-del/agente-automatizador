name: Agent Cloud Worker

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  route:
    name: route cloud lanes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        github.actor == 'palgarra14-del' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.event.issue.pull_request == null &&
            startsWith(github.event.comment.body, '/agent')
          )
        )
      )
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.route.outputs.lanes }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Route event to trusted cloud lanes
        id: route
        shell: bash
        env:
          AGENT_CLOUD_EVENT_NAME: ${{ github.event_name }}
          AGENT_CLOUD_EVENT_ACTION: ${{ github.event.action }}
          AGENT_CLOUD_ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          LANES="$(node scripts/cloud-lane-route.js)"
          node -e 'const lanes=JSON.parse(process.argv[1]); if (!Array.isArray(lanes) || lanes.length < 1 || lanes.some((lane) => typeof lane !== "string" || !/^[a-z0-9-]{1,80}$/.test(lane))) process.exit(1)' "$LANES"
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"

  cloud-once:
    name: cloud-once (${{ matrix.lane }})
    needs: route
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.route.outputs.lanes) }}
    concurrency:
      group: agent-${{ matrix.lane }}-cloud
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --ignore-scripts

      - name: Check lane for governed work
        id: preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "issues" || "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            node src/cli.js inbox cloud-admit --lane "$AGENT_CLOUD_LANE"
          fi
          HAS_WORK="$(node src/cli.js inbox cloud-peek --lane "$AGENT_CLOUD_LANE")"
          if [[ "$HAS_WORK" != "true" && "$HAS_WORK" != "false" ]]; then
            echo "invalid cloud preflight result" >&2
            exit 1
          fi
          echo "has_work=$HAS_WORK" >> "$GITHUB_OUTPUT"

      - name: Prepare exact cloud runtime
        if: steps.preflight.outputs.has_work == 'true'
        shell: bash
        run: |
          node src/cli.js runtime sync
          docker run --rm --entrypoint git agent-node22-pnpm11:local --version

      - name: Run one governed cloud queue tick
        if: steps.preflight.outputs.has_work == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
        run: exec node src/cli.js inbox cloud-once --lane "$AGENT_CLOUD_LANE"
