name: Agent Cloud Worker

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  cloud-once:
    name: cloud-once (${{ matrix.lane }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        github.actor == 'palgarra14-del' &&
        (github.event_name != 'issue_comment' || github.event.issue.pull_request == null)
      )
    strategy:
      fail-fast: false
      matrix:
        lane: [self, website-pilot, callflow]
    concurrency:
      group: agent-${{ matrix.lane }}-cloud
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --ignore-scripts

      - name: Check lane for governed work
        id: preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
        run: |
          HAS_WORK="$(node src/cli.js inbox cloud-peek --lane "$AGENT_CLOUD_LANE")"
          if [[ "$HAS_WORK" != "true" && "$HAS_WORK" != "false" ]]; then
            echo "invalid cloud preflight result" >&2
            exit 1
          fi
          echo "has_work=$HAS_WORK" >> "$GITHUB_OUTPUT"

      - name: Prepare exact cloud runtime
        if: steps.preflight.outputs.has_work == 'true'
        run: docker pull node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5

      - name: Run one governed cloud queue tick
        if: steps.preflight.outputs.has_work == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
        run: exec node src/cli.js inbox cloud-once --lane "$AGENT_CLOUD_LANE"
