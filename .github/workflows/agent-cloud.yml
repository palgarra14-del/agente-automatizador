name: Agent Cloud Worker

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: agent-self-cloud
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  cloud-once:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        github.actor == 'palgarra14-del' &&
        (github.event_name != 'issue_comment' || github.event.issue.pull_request == null)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --ignore-scripts

      - name: Prepare exact self runtime
        run: docker pull node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5

      - name: Run one governed cloud queue tick
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: exec node src/cli.js inbox cloud-once
