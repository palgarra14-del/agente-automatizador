name: Agent Cloud Worker

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  route:
    name: route cloud lanes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        github.actor == 'palgarra14-del' &&
        (
          github.event_name != 'issue_comment' ||
          github.event.issue.pull_request == null
        )
      )
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.wakeup.outputs.active }}
      lanes: ${{ steps.route.outputs.lanes }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Validate governed wakeup
        id: wakeup
        shell: bash
        env:
          AGENT_CLOUD_EVENT_NAME: ${{ github.event_name }}
          AGENT_CLOUD_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          ACTIVE="$(node -e 'const body=(process.env.AGENT_CLOUD_COMMENT_BODY ?? "").trim(); process.stdout.write(process.env.AGENT_CLOUD_EVENT_NAME !== "issue_comment" || body === "/agent" || body.startsWith("/agent ") ? "true" : "false")')"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"

      - name: Route event to trusted cloud lanes
        id: route
        if: steps.wakeup.outputs.active == 'true'
        shell: bash
        env:
          AGENT_CLOUD_EVENT_NAME: ${{ github.event_name }}
          AGENT_CLOUD_EVENT_ACTION: ${{ github.event.action }}
          AGENT_CLOUD_ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          LANES="$(node scripts/cloud-lane-route.js)"
          node -e 'const lanes=JSON.parse(process.argv[1]); if (!Array.isArray(lanes) || lanes.length < 1 || lanes.some((lane) => typeof lane !== "string" || !/^[a-z0-9-]{1,80}$/.test(lane))) process.exit(1)' "$LANES"
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"

  admit:
    name: admit cloud event (${{ matrix.lane }})
    needs: route
    if: needs.route.outputs.active == 'true' && (github.event_name == 'issues' || github.event_name == 'issue_comment')
    permissions:
      contents: write
      issues: read
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.route.outputs.lanes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Persist create-only event intent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
        run: for _ in {1..30}; do node src/cli.js inbox cloud-admit --lane "$AGENT_CLOUD_LANE" && exit 0; sleep 10; done; exit 1

  cloud-once:
    name: cloud-once (${{ matrix.lane }})
    needs: [route, admit]
    if: always() && needs.route.outputs.active == 'true' && (needs.admit.result == 'success' || needs.admit.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.route.outputs.lanes) }}
    concurrency:
      group: agent-${{ matrix.lane }}-cloud
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Repair authorized partial cloud state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
        run: node src/cli.js inbox cloud-repair --lane "$AGENT_CLOUD_LANE"

      - name: Recover missing admissions from open requests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
        run: node src/cli.js inbox cloud-recover --lane "$AGENT_CLOUD_LANE"

      - name: Run lightweight cloud control tick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
        run: node src/cli.js inbox cloud-control-once --lane "$AGENT_CLOUD_LANE"

      - name: Check lane for executable work
        id: preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
          CROSS_REPO_CREDENTIAL_CONFIGURED: ${{ secrets.AGENT_GITHUB_TOKEN != '' && 'true' || 'false' }}
        run: |
          HAS_WORK="$(node src/cli.js inbox cloud-execution-peek --lane "$AGENT_CLOUD_LANE")"
          if [[ "$HAS_WORK" != "true" && "$HAS_WORK" != "false" ]]; then
            echo "invalid cloud execution preflight result" >&2
            exit 1
          fi
          SKIP_REASON=""
          if [[ "$AGENT_CLOUD_LANE" == "website-pilot" && "$HAS_WORK" == "true" && "$CROSS_REPO_CREDENTIAL_CONFIGURED" != "true" ]]; then
            HAS_WORK="false"
            SKIP_REASON="cross_repo_credential_missing"
            echo "::notice::website-pilot execution deferred because AGENT_GITHUB_TOKEN is not configured"
          fi
          echo "has_work=$HAS_WORK" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$SKIP_REASON" >> "$GITHUB_OUTPUT"

      - name: Install frozen dependencies for executable work
        if: steps.preflight.outputs.has_work == 'true'
        run: npm ci --ignore-scripts

      - name: Prepare exact cloud runtime
        if: steps.preflight.outputs.has_work == 'true'
        shell: bash
        run: |
          node src/cli.js runtime sync
          docker run --rm --entrypoint git agent-node22-pnpm11:local --version

      - name: Run one governed cloud queue tick
        if: steps.preflight.outputs.has_work == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_CLOUD_LANE: ${{ matrix.lane }}
        run: exec node src/cli.js inbox cloud-once --lane "$AGENT_CLOUD_LANE"
